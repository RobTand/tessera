# The pure half of the repo runs anywhere; the kernel half needs a GPU.
#
# The bytes-only job proves the parser's dependency boundary without torch.
# The coordinator separately dispatches GPU-visible and device-less suites
# through PrismaBuild and records both populations. Hosted CI alone does not
# cover the CUDA surface, and test success does not establish served quality.
name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # merge_suite records whether the tested commit is master.  A PR's
          # default depth-1 synthetic-merge checkout contains neither master
          # nor origin/master, so absence would masquerade as no population.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Bytes-only tests: everything here collects and runs with no torch, no
      # GPU and no model data.  The byte layer (``tessera.layout`` without its
      # slicing half, plus container, manifest, grammar, planes and friends)
      # is stdlib-only by design, and this job proves that structurally: the
      # interpreter above has no torch to import.  Every exclusion below names
      # its reason, so a test that stops needing torch becomes a deletion here
      # rather than a silent absence.
      - name: bytes-only tests (no torch, no GPU, no model data)
        # No ignore list.  Most test modules need torch and cannot be
        # collected here, but WHICH ones is a question each module answers
        # itself -- `tests/conftest.py` builds `collect_ignore` by trying the
        # import and skipping only what fails on a missing third-party
        # dependency.  A module that fails on one of ITS OWN names still
        # fails the run, which is the breakage this job exists to catch, and
        # a new torch-needing test file needs no edit here.
        run: |
          PYTHONPATH=src python -m pytest tests -q -p no:cacheprovider

      # The byte layer must load with no torch in the process -- not just the
      # tests above, but the modules themselves, including the test closure.
      # ``tessera.slicing`` (the torch half of ``layout``) must stay
      # unimported: reaching for a cutter name is what pulls torch in, and
      # only reaching for one.
      - name: byte-layer modules import without torch
        run: |
          PYTHONPATH=src:tests python - <<'PY'
          import sys
          import tessera.alphabet
          import tessera.canonical
          import tessera.container
          import tessera.errors
          import tessera.exact
          import tessera.grammar
          import tessera.layout
          import tessera.manifest
          import tessera.planes
          import tessera.provenance
          import tessera.trellis
          import conftest
          assert "torch" not in sys.modules, (
              "the byte layer pulled torch in: "
              + str([m for m in sys.modules if m.split(".")[0] == "torch"])
          )
          assert "tessera.slicing" not in sys.modules, (
              "importing tessera.layout eagerly pulled its torch half in"
          )
          print("byte layer loads with no torch")
          PY

      # S14's ledger invariant is absolute: no prohibited-source artifact
      # participates.  `provenance.py` ships the MECHANISM and the list is
      # deliberately empty, so this check refuses the one failure mode an empty
      # denylist creates -- silently certifying everything.  It asserts the
      # refusal fires, not that the list has entries.
      - name: item 11 -- an empty denylist must refuse to certify
        run: |
          PYTHONPATH=src python - <<'PY'
          from tessera.provenance import assert_denylist_populated, Denylist
          from tessera.errors import ProvenanceError
          try:
              assert_denylist_populated(Denylist())
          except ProvenanceError as refusal:
              print(f"refused as required: {refusal}")
          else:
              raise SystemExit(
                  "assert_denylist_populated accepted an empty denylist; "
                  "silently passing everything is the failure this check exists for"
              )
          PY

      # Both distributions are artifacts with their own failure modes: a data
      # file the package-data table forgot ships nowhere and an editable
      # install never says so, and setuptools' sweep decides sdist contents
      # when MANIFEST.in does not.  Build both here on every push and prove,
      # from an empty directory with the source tree off the path, that the
      # plugin entry point resolves and every file a route or a producer opens
      # is inside the wheel -- and that the sdist carries exactly the wheel's
      # sources plus the inputs that rebuild it.
      - name: the wheel and the sdist ship what they must, and nothing else
        run: |
          python -m pip install --quiet --upgrade build
          python -m build
          python tools/check_wheel.py dist/*.whl dist/*.tar.gz

  # Publishing rides the same workflow the Trusted Publisher on PyPI names, and
  # only ever on a version tag, only after the pure job is green.  There is no
  # token in this repo: `id-token: write` is what PyPI verifies.  The tag must
  # name the version the package carries -- checked below -- so a wheel can
  # never claim a version its tag does not.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pure
    runs-on: ubuntu-latest
    # The ancestry step below says which commit may publish; this says who has
    # to agree before the job's OIDC token exists at all.  It is the only gate
    # that sits before the credentials, so a tag pushed by mistake waits here.
    #
    # The environment itself is NOT in this file and cannot be: it is created
    # in repository Settings -> Environments, and it protects nothing until a
    # required reviewer is added there.  Its deployment rule must admit tags
    # ("Selected branches and tags", pattern `v*`) -- "protected branches only"
    # refuses a tag-triggered run outright.  And PyPI's Trusted Publisher for
    # this project must name the same environment, because the environment is
    # one of the claims the token exchange matches.  Naming an environment here
    # while PyPI names none is a mismatch, so the two land together.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The ancestry check below reads reachability out of git, and a
          # shallow clone cannot answer that from the history it holds.
          fetch-depth: 0
      # A `v*` tag is not a review gate -- anyone who can push one can push it
      # at any commit.  This is the gate, and it runs first: a commit that
      # will not be published is not built either.
      - name: the tagged commit must be on master
        run: bash .github/scripts/require_tag_on_master.sh "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: the tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject version $ver"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build
      # The same proof the pure job ran, on the bytes about to be published.
      - run: python tools/check_wheel.py dist/*.whl dist/*.tar.gz
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
