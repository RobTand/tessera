# The pure half of the repo runs anywhere; the kernel half needs a GPU.
#
# Splitting them is the point.  Build items 1a/1b are stdlib-only by design --
# S16 forbids pipeline wiring before 1b passes, and a job that needs no torch
# proves that structurally rather than by discipline.  The kernel lane is
# pre-gate research (S16 P1-6/P1-7) and cannot run here; it is gated on a GPU
# runner and must never become a required check, because a green tick on a
# screen is exactly the promotion this project refuses.
name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Bytes-only tests: everything here collects and runs with no torch, no
      # GPU and no model data.  The byte layer (``tessera.layout`` without its
      # slicing half, plus container, manifest, grammar, planes and friends)
      # is stdlib-only by design, and this job proves that structurally: the
      # interpreter above has no torch to import.  Every exclusion below names
      # its reason, so a test that stops needing torch becomes a deletion here
      # rather than a silent absence.
      - name: bytes-only tests (no torch, no GPU, no model data)
        # No ignore list.  Most test modules need torch and cannot be
        # collected here, but WHICH ones is a question each module answers
        # itself -- `tests/conftest.py` builds `collect_ignore` by trying the
        # import and skipping only what fails on a missing third-party
        # dependency.  A module that fails on one of ITS OWN names still
        # fails the run, which is the breakage this job exists to catch, and
        # a new torch-needing test file needs no edit here.
        run: |
          PYTHONPATH=src python -m pytest tests -q -p no:cacheprovider \
            --ignore=tests/test_kernel.py --ignore=tests/test_ktuple.py

      # The byte layer must load with no torch in the process -- not just the
      # tests above, but the modules themselves, including the test closure.
      # ``tessera.slicing`` (the torch half of ``layout``) must stay
      # unimported: reaching for a cutter name is what pulls torch in, and
      # only reaching for one.
      - name: byte-layer modules import without torch
        run: |
          PYTHONPATH=src:tests python - <<'PY'
          import sys
          import tessera.alphabet
          import tessera.canonical
          import tessera.container
          import tessera.errors
          import tessera.exact
          import tessera.grammar
          import tessera.layout
          import tessera.manifest
          import tessera.planes
          import tessera.provenance
          import tessera.trellis
          import conftest
          assert "torch" not in sys.modules, (
              "the byte layer pulled torch in: "
              + str([m for m in sys.modules if m.split(".")[0] == "torch"])
          )
          assert "tessera.slicing" not in sys.modules, (
              "importing tessera.layout eagerly pulled its torch half in"
          )
          print("byte layer loads with no torch")
          PY

      # S14's ledger invariant is absolute: no prohibited-source artifact
      # participates.  `provenance.py` ships the MECHANISM and the list is
      # deliberately empty, so this check refuses the one failure mode an empty
      # denylist creates -- silently certifying everything.  It asserts the
      # refusal fires, not that the list has entries.
      - name: item 11 -- an empty denylist must refuse to certify
        run: |
          PYTHONPATH=src python - <<'PY'
          from tessera.provenance import assert_denylist_populated, Denylist
          from tessera.errors import ProvenanceError
          try:
              assert_denylist_populated(Denylist())
          except ProvenanceError as refusal:
              print(f"refused as required: {refusal}")
          else:
              raise SystemExit(
                  "assert_denylist_populated accepted an empty denylist; "
                  "silently passing everything is the failure this check exists for"
              )
          PY

  # Publishing rides the same workflow the Trusted Publisher on PyPI names, and
  # only ever on a version tag, only after the pure job is green.  There is no
  # token in this repo: `id-token: write` is what PyPI verifies.  The tag must
  # name the version the package carries -- checked below -- so a wheel can
  # never claim a version its tag does not.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject version $ver"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
