# Adapted from PrismaBuild's hosted gate. No label event triggers.
name: hosted gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: hosted-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GATE_SHARDS: '2' # Per lane; four test jobs in the full matrix.
  GATE_RUNNERS: ubuntu-24.04,ubuntu-24.04-arm
  CUDA_VISIBLE_DEVICES: ''
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONPATH: src
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select population and balance both lanes
        id: plan
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha }}
          GATE_MODE: ${{ github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162) || contains(github.event.pull_request.labels.*.name, 'gate-canary')) && 'full' || 'selection' }}
        run: |
          python tools/ci/gate_select.py --base "$GATE_BASE" --head "$GATE_HEAD" \
            --mode "$GATE_MODE" --shards "$GATE_SHARDS" --runners "$GATE_RUNNERS" \
            --output gate-artifacts/plan.json --matrix gate-artifacts/matrix.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
          retention-days: 7
  shards:
    name: shard-${{ matrix.index }}-${{ matrix.lane }}-a1
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.has_tests == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/gate_requirements.txt
      - name: Install pinned lane dependencies
        run: |
          python -m pip install -r tools/ci/gate_requirements.txt
          if [ '${{ matrix.lane }}' = torch ]; then
            python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install numpy==2.3.4 safetensors==0.6.2
          else
            python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          fi
      - name: Run assigned population
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('gate-artifacts/matrix.json').read_text())['include']
          row = next(row for row in rows if row['index'] == int(os.environ['SHARD_INDEX']))
          Path('gate-artifacts/assigned.txt').write_text('\n'.join(row['files']) + '\n')
          PYTHON
          python tools/ci/gate_run.py --plan gate-artifacts/plan.json --lane '${{ matrix.lane }}' \
            --files-from gate-artifacts/assigned.txt --workers 4 \
            --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml
      - name: Upload verdict, timings and CPU population
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-result-${{ github.run_attempt }}-a1-${{ matrix.index }}
          path: |
            gate-artifacts/result.json
            gate-artifacts/junit.xml
            gate-artifacts/surface*.json
          if-no-files-found: warn
          retention-days: 7
  retry-plan:
    needs: [plan, shards]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.retry.outputs.matrix }}
      retry: ${{ steps.retry.outputs.retry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: gate-result-${{ github.run_attempt }}-a1-*
          path: verdicts
      - name: Retry only shards without verdicts
        id: retry
        run: |
          python3 tools/ci/gate_actions.py retries --plan gate-artifacts/plan.json \
            --matrix gate-artifacts/matrix.json --artifacts verdicts \
            --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/retries.json >> "$GITHUB_OUTPUT"
  retry-shards:
    name: shard-${{ matrix.index }}-${{ matrix.lane }}-a2
    needs: [plan, retry-plan]
    if: ${{ !cancelled() && needs.retry-plan.result == 'success' && needs.retry-plan.outputs.retry == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/gate_requirements.txt
      - name: Install pinned lane dependencies
        run: |
          python -m pip install -r tools/ci/gate_requirements.txt
          if [ '${{ matrix.lane }}' = torch ]; then
            python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install numpy==2.3.4 safetensors==0.6.2
          else
            python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          fi
      - name: Run assigned population
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('gate-artifacts/matrix.json').read_text())['include']
          row = next(row for row in rows if row['index'] == int(os.environ['SHARD_INDEX']))
          Path('gate-artifacts/assigned.txt').write_text('\n'.join(row['files']) + '\n')
          PYTHON
          python tools/ci/gate_run.py --plan gate-artifacts/plan.json --lane '${{ matrix.lane }}' \
            --files-from gate-artifacts/assigned.txt --workers 4 \
            --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml
      - name: Upload verdict, timings and CPU population
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-result-${{ github.run_attempt }}-a2-${{ matrix.index }}
          path: |
            gate-artifacts/result.json
            gate-artifacts/junit.xml
            gate-artifacts/surface*.json
          if-no-files-found: warn
          retention-days: 7
  pr-gate:
    name: pr-gate
    needs: [plan, shards, retry-plan, retry-shards]
    if: ${{ !cancelled() && !(github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162) || contains(github.event.pull_request.labels.*.name, 'gate-canary'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a complete plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success || exit 75
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: gate-result-${{ github.run_attempt }}-*
          path: verdicts
      - name: Require complete lane coverage and final verdicts
        run: |
          python3 tools/ci/gate_actions.py finish --plan gate-artifacts/plan.json \
            --matrix gate-artifacts/matrix.json --artifacts verdicts \
            --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/final.json \
            --effective-output gate-artifacts/effective --summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-pr-gate-final-${{ github.run_attempt }}
          path: gate-artifacts
          retention-days: 7
  gate:
    name: gate
    needs: [plan, shards, retry-plan, retry-shards]
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162) || contains(github.event.pull_request.labels.*.name, 'gate-canary')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a complete plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success || exit 75
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: gate-result-${{ github.run_attempt }}-*
          path: verdicts
      - name: Require complete lane coverage and final verdicts
        run: |
          python3 tools/ci/gate_actions.py finish --plan gate-artifacts/plan.json \
            --matrix gate-artifacts/matrix.json --artifacts verdicts \
            --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/final.json \
            --effective-output gate-artifacts/effective --summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-gate-final-${{ github.run_attempt }}
          path: gate-artifacts
          retention-days: 7
