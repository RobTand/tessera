# Publish Tessera to PyPI through PyPI's Trusted Publisher (OIDC): no token in
# the repo.  The pending publisher on PyPI names this repository (RobTand/
# tessera) and this workflow file; the job's `id-token: write` is what PyPI
# verifies.  Runs on a version tag push (v0.1.0 -> tessera 0.1.0); the tag
# must match pyproject's version, checked below, so a wheel never carries a
# version its tag does not name.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject version $ver"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # If the pending publisher on PyPI names an environment, it must be this
    # one; delete the line if none was named.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
