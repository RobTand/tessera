# FIFO queue: check one PR at a time, in queue-label order.
# Each draft contains the newest master and requires a passing "gate".
# No batches, parallel checks, priority lanes, splits or automatic retries.
# Add "queue" to queue. Remove it to dequeue. After failure, use "@mergifyio queue".
# Keep the issue check on original PRs and the TL3b App command allowance.
scopes:
  source:
    manual:

commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]
  requeue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]

merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false
  queued_label: queued
  dequeued_label: dequeued

queue_rules:
  - name: default
    queue_conditions:
      - base = master
      - -draft
      - label = queue
      - check-success = branch rule
      - check-success = pr-gate
    merge_conditions:
      - check-success = gate
    merge_method: merge
    batch_size: 1
    max_checks_retries: 0
    checks_timeout: 30 minutes

pull_request_rules:
  - name: queue pull requests labelled "queue"
    conditions:
      - base = master
      - label = queue
      - -draft
    actions:
      queue:
