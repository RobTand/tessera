[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-quant"
version = "0.1.0"
description = "Tessera: continuous-rate trellis-coded quantization of LLM weights onto hardware-native NVFP4, FP8 and BF16 tiles, with its own vLLM serving plugin"
readme = "README.md"
authors = [{name = "Robert Tand", email = "robert.tand@icloud.com"}]
keywords = ["quantization", "trellis", "NVFP4", "FP8", "vLLM", "LLM"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "safetensors"]

[project.optional-dependencies]
# The serving half registers with vLLM; the fused kernels are Triton (bundled
# with torch on Linux) plus one CUDA source JIT-built by torch at first use.
serve = ["vllm>=0.28"]
kernels = ["triton"]

[project.urls]
Homepage = "https://github.com/RobTand/tessera"
Source = "https://github.com/RobTand/tessera"

[project.entry-points."vllm.general_plugins"]
# Tessera's serving half: registers quant_method="tessera" with vLLM.  The
# checkpoint selects it; the only operator knob is TESSERA_SERVE_MODE.
tessera = "tessera.serving:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The packaged runtime contract a producer reads through importlib.resources,
# and the CUDA source the NVFP4 route JIT-builds.  An editable install reads
# the tree and would not notice these missing; a wheel would.
"tessera.serving" = ["runtime_contract.json", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
