[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "tessera-quant"
version = "0.1.0"
description = "Tessera: trellis-coded quantization of LLM weights onto hardware-native NVFP4, FP8 and BF16 tiles, continuous-rate on the FP8 and BF16 grids, with its own vLLM serving plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Robert Tand", email = "robert.tand@icloud.com"}]
keywords = ["quantization", "trellis", "NVFP4", "FP8", "vLLM", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    # The only minor the suite and CI exercise; requires-python is wider.
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "safetensors"]

[project.optional-dependencies]
# The serving half registers with vLLM; the fused kernels are Triton (bundled
# with torch on Linux) plus one CUDA source JIT-built by torch at first use.
serve = ["vllm>=0.28"]
kernels = ["triton"]

[project.urls]
Homepage = "https://github.com/RobTand/tessera"
Source = "https://github.com/RobTand/tessera"
Documentation = "https://github.com/RobTand/tessera/blob/v0.1.0/docs/ARCHITECTURE.md"
Issues = "https://github.com/RobTand/tessera/issues"

[project.entry-points."vllm.general_plugins"]
# Tessera's serving half: registers quant_method="tessera" with vLLM.  The
# checkpoint selects it; the only operator knob is TESSERA_SERVE_MODE.
tessera = "tessera.serving:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The packaged runtime contract a producer reads through importlib.resources,
# and the CUDA sources the routes JIT-build (the span-2 NVFP4 decoder and the
# window-body GEMV).  An editable install reads the tree and would not notice
# these missing; a wheel would.
"tessera.serving" = ["runtime_contract.json", "csrc/*.cu"]
# The window GEMV's kernel source sits in the library's own csrc, not the
# serving lane's, and it is JIT-built the same way.  Without this line a wheel
# installs a module whose first call raises FileNotFoundError.
"tessera" = ["csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
